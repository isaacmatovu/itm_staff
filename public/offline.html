<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · ITM Task Tracking</title>
  <!-- Served by public/sw.js when a navigation fails with no network.
       Fully self-contained (no external CSS/JS) since nothing else can load. -->
  <style>
    :root { --bg: #f6f8fc; --surface: #fff; --text: #1f2430; --muted: #5f6368; --primary: #1a73e8; --border: rgba(31,36,48,.1); }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #131417; --surface: #1e2025; --text: #e8eaed; --muted: #9aa0a6; --primary: #8ab4f8; --border: rgba(232,234,237,.14); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text); font: 14px/1.5 "Inter", system-ui, -apple-system, sans-serif; }
    .card { max-width: 380px; width: 100%; text-align: center; padding: 32px 24px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
    img { width: 56px; height: 56px; }
    h1 { font-size: 18px; margin: 16px 0 6px; }
    p { margin: 0 0 20px; color: var(--muted); }
    button { font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 999px;
      padding: 10px 20px; background: var(--primary); color: #fff; }
    @media (prefers-color-scheme: dark) { button { color: #131417; } }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icon-192x192.png" alt="" />
    <h1>You're offline</h1>
    <p>ITM Task Tracking needs a connection to load your tasks. Check your network and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
